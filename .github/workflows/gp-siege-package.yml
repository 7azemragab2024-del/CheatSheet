name: GP SIEGE source clips
on:
  push:
    branches:
      - gp-siege-render-temp

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pexels source clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clips
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/10816903/" -o clips/01_tunnel_pov.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/6872069/" -o clips/02_black_car_closeup.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/9174926/" -o clips/03_dashboard.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/10275944/" -o clips/04_tunnel_drive.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/29498827/" -o clips/05_dim_garage.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://www.pexels.com/download/video/13796181/" -o clips/06_black_car_park.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://videos.pexels.com/video-files/11372920/11372920-hd_1080_1920_60fps.mp4" -o clips/07_night_traffic.mp4
          curl -A "Mozilla/5.0" --fail --location --retry 3 "https://videos.pexels.com/video-files/6872087/6872087-uhd_2160_3840_25fps.mp4" -o clips/08_luxury_car.mp4
          for f in clips/*.mp4; do
            test -s "$f"
            file "$f"
          done
      - name: Upload source clips
        uses: actions/upload-artifact@v4
        with:
          name: GP-SIEGE-source-clips
          path: clips/*.mp4
          if-no-files-found: error
          retention-days: 1
